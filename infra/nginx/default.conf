# Single entry point:  /  -> frontend    /api/ -> backend    /grafana/ -> Grafana
# Runs unprivileged (port 8080 inside the container; compose publishes it as HTTP_PORT).

# Brute-force guard for sign-in / registration: 10 requests per minute per client, small bursts allowed.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# Re-resolve service names so a restarted container with a new IP is found again.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    client_max_body_size 1m;

    # Security headers on every response (Grafana adds its own CSP; the app's is applied to the frontend below).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # --- API (the "/api" prefix is stripped before the request reaches the backend)
    location = /api { return 301 /api/; }
    # Not for the public internet: /metrics is for an internal monitoring system, and the scraper calls /internal/* directly.
    location = /api/metrics { return 404; }
    location ^~ /api/internal/ { return 404; }
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # --- Grafana (it serves itself under /grafana/, so the prefix is kept). Variables make nginx look the name up
    # per request, so nginx still starts when Grafana is not running.
    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /grafana/api/live/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Frontend
    location / {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
