# Prometheus: every 15 seconds, read the numbers each service publishes at /metrics and keep them.
# The names (backend, scraper) are the compose service names, reachable on the stack's private network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend            # the API: requests, errors, latency, jobs, students, ingest, alert emails
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: scraper            # the scheduled scraper: runs, jobs, pages, pushes, last success
    metrics_path: /metrics
    static_configs:
      - targets: ["scraper:9100"]

  - job_name: prometheus         # Prometheus watching itself
    static_configs:
      - targets: ["localhost:9090"]
