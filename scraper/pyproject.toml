[project]
name = "scraper"
version = "0.1.0"
description = "Career-site scraping module for the job aggregator platform"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the versions the test suite (and the backend integration tests) were run against.
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "tenacity==9.2.1",
    "typer==0.27.3",
    "beautifulsoup4==4.15.0",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-httpx==0.36.2", "ruff==0.17.1"]

[project.scripts]
scraper = "scraper.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits real network services (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 130
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
