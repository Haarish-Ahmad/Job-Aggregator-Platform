# One image holds every source adapter; pick the site with --source.
# Ollama itself is not containerised here; run it on the host (it needs the GPU).
services:
  scraper:
    build: .
    env_file: .env
    environment:
      # Only needed by adapters that use Firecrawl (not Microsoft). Points at a Firecrawl
      # running on the host; for the bundled self-host stack use its compose file instead.
      FIRECRAWL_API_URL: http://host.docker.internal:3002
      # LLM extraction (`--extract`) talks to Ollama running on the host.
      OLLAMA_URL: http://host.docker.internal:11434
      OUTPUT_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
