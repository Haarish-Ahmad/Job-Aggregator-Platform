# Job Aggregator Platform: one command brings up the whole stack.
#
#   cp .env.example .env      # fill in the secrets (see comments inside)
#   docker compose up -d --build
#   open http://localhost     (app)   /grafana/ (dashboards)   /api/docs (API docs)
#
# Firecrawl is NOT part of this file: it runs outside (see README) and is reached through FIRECRAWL_API_URL.
# host.docker.internal is mapped so a host-side service works on Linux too.

name: job-aggregator

x-restart: &restart
  restart: unless-stopped

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.27.8
    # Dev mail catcher: alert emails land here instead of reaching real people. Replace with a real SMTP
    # server by setting SMTP_HOST/SMTP_PORT/... in .env (and drop this service).
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *restart
    image: ${IMAGE_PREFIX:-job-aggregator}-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobs}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ROOT_PATH: /api
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-alerts@jobs.local}
      ALERT_MIN_SCORE: ${ALERT_MIN_SCORE:-60}
      STALE_DAYS: ${STALE_DAYS:-14}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  scraper:
    <<: [*restart, *host-gateway]
    image: ${IMAGE_PREFIX:-job-aggregator}-scraper:${IMAGE_TAG:-local}
    build:
      context: ./scraper
    depends_on:
      backend: { condition: service_healthy }
    environment:
      BACKEND_URL: http://backend:8000
      INGEST_TOKEN: ${INGEST_TOKEN}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-http://host.docker.internal:3002}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      SERVE_SOURCES: ${SERVE_SOURCES:-unstop,shine,internshala}
      SERVE_LIMIT: ${SERVE_LIMIT:-300}
      SCRAPE_INTERVAL_HOURS: ${SCRAPE_INTERVAL_HOURS:-12}
      RUN_ON_START: ${RUN_ON_START:-true}
      REQUEST_DELAY_SECONDS: ${REQUEST_DELAY_SECONDS:-1.5}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      GREENHOUSE_COMPANIES: ${GREENHOUSE_COMPANIES:-databricks,okta,gitlab,rubrik,netskope,elastic,twilio,coinbase,datadog,groww,airbnb,stripe,mixpanel,anthropic,zscaler,vercel,mongodb,figma,cloudflare}
    volumes:
      - scraper_data:/data

  frontend:
    <<: *restart
    image: ${IMAGE_PREFIX:-job-aggregator}-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
    environment:
      API_BASE: /api

  nginx:
    <<: *restart
    image: ${IMAGE_PREFIX:-job-aggregator}-nginx:${IMAGE_TAG:-local}
    build:
      context: ./infra/nginx
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.5.0
    # Collects the numbers the backend and scraper publish at /metrics. Settings are mounted from the repo
    # (monitoring/prometheus/prometheus.yml). Only reachable from this machine, on 127.0.0.1.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    <<: *restart
    image: grafana/grafana:12.1.0
    # Draws dashboards from Prometheus's data, served at /grafana/ through nginx. The data source and dashboards
    # are mounted from monitoring/grafana, so there is nothing to click together.
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      # First-start login. admin / admin is fine on your own machine; set real values before exposing the site.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_state:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Not under /var/lib/grafana: the state volume there would hide it.
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  scraper_data:
  prom_data:
  grafana_state:
