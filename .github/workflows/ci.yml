name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by the release workflow; PRs by the trigger above

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test database used by the backend and integration jobs.
  TEST_DATABASE_URL: postgresql://jobs:jobs@localhost:5432/jobs_test

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: jobs, POSTGRES_PASSWORD: jobs, POSTGRES_DB: jobs_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r ../requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy --ignore-missing-imports --explicit-package-bases --exclude 'alembic|tests' .
      - name: Migrations apply to an empty database and match the models
        env:
          APP_ENV: dev
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest --cov=. --cov-report=term-missing:skip-covered -q

  scraper:
    name: Scraper (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  integration:
    name: Scraper to backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: jobs, POSTGRES_PASSWORD: jobs, POSTGRES_DB: jobs_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scraper/pyproject.toml
      - run: pip install -r requirements-dev.txt -e "scraper[dev]"
      - name: fixture markdown, backend ingest, queryable via the API
        run: pytest tests/integration -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  config:
    name: Config (env variables, compose files, shell scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Every variable is documented in .env.example and wired into compose
        run: python3 scripts/check_env.py
      - name: Compose files render, and refuse to start without secrets
        run: |
          printf 'POSTGRES_PASSWORD=x\nSECRET_KEY=x\nINGEST_TOKEN=x\n' > "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file "$RUNNER_TEMP/ci.env" config -q
          if docker compose --env-file /dev/null config -q 2>/dev/null; then echo "compose must require the secrets"; exit 1; fi
      - name: Shell scripts pass shellcheck
        run: shellcheck scripts/smoke.sh backend/docker-entrypoint.sh frontend/docker-entrypoint.sh server-setup/*.sh
      - name: No Windows line endings in files that run in Linux containers
        run: |
          if git grep -Il $'\r' -- '*.sh' '*Dockerfile' '*.yml' '*.yaml' '*.conf'; then echo "CRLF found (see .gitattributes)"; exit 1; fi

  images:
    name: Build image (${{ matrix.service }})
    needs: [backend, scraper, integration, frontend, config]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend, context: ., file: backend/Dockerfile }
          - { service: scraper, context: scraper, file: scraper/Dockerfile }
          - { service: frontend, context: frontend, file: frontend/Dockerfile }
          - { service: nginx, context: infra/nginx, file: infra/nginx/Dockerfile }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  smoke:
    name: Compose smoke test (mocked Firecrawl)
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the smoke test (brings the stack up, checks it, prints container logs if it fails, tears it down)
        run: bash scripts/smoke.sh
