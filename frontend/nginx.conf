# Serves the built SPA. In the full stack the edge nginx (infra/nginx) sits in front of this and routes /api to the backend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Hashed build output never changes under the same name.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Runtime config and the HTML shell must always be fresh.
    location = /config.js { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Client-side routes fall back to the app.
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
