    skills: [oop, java, c++, design patterns]
  - name: Database Management Systems
    skills: [sql, mysql, postgresql, database, dbms]
  - name: Operating Systems and Networks
    skills: [linux, operating systems, networking, shell scripting]
  - name: Web Technologies
    skills: [html, css, javascript, react, node.js, rest api, django, flask]
  - name: Software Engineering
    skills: [git, agile, testing, software testing, ci/cd, jira]
  - name: Machine Learning
    skills: [machine learning, deep learning, tensorflow, pytorch, scikit-learn, pandas, numpy, nlp]
  - name: Data Analytics
    skills: [data analysis, excel, power bi, tableau, statistics, data visualization]
  - name: Cloud and DevOps
    skills: [docker, kubernetes, aws, azure, gcp, jenkins, terraform]
  - name: Information Security
    skills: [cyber security, cryptography, network security, penetration testing]
