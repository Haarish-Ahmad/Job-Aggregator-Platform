# Real errors only (syntax, undefined names, unused imports/variables, common bug patterns).
# Formatting rules are off: the original code uses a compact style and reformatting it would bury real diffs.
line-length = 130
extend-exclude = ["alembic/versions"]

[lint]
select = ["E9", "F", "B"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in argument defaults is the framework's idiom

